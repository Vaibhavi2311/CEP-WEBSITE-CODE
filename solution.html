    function switchLang(lang) {
      const langData = data[lang] || data.en;
      document.getElementById("title").innerText = langData.title;
      document.getElementById("illnessHead").innerText = langData.headers[0];
      document.getElementById("modernHead").innerText = langData.headers[1];
      document.getElementById("traditionalHead").innerText = langData.headers[2];
      const tbody = document.getElementById("remedyTable");
      tbody.innerHTML = "";
      langData.remedies.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.innerText = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      document.getElementById("search").value = "";
    }

    document.getElementById("search").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      const rows = document.querySelectorAll("#remedyTable tr");
      rows.forEach(row => {
        const illness = row.children[0].innerText.toLowerCase();
        row.style.display = illness.includes(value) ? "" : "none";
      });
    });
